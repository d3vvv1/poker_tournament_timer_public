# Анонс релиза в Telegram: архив Windows-версии из GitHub Release и описание релиза.
# Срабатывает при публикации GitHub Release; вручную — Actions → Notify release → Run workflow с тегом.
# В имени архива должно быть «windows», например poker_tournament_timer_windows.zip.
# Секреты: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (без них шаг пропускается).
name: Notify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v1.2.0
        required: true

permissions:
  contents: read

jobs:
  notify:
    uses: d3vvv1/release-notify/.github/workflows/notify.yml@main
    with:
      project: Poker Tournament Timer
      release_tag: ${{ github.event.release.tag_name || inputs.tag }}
      asset_pattern: '*windows*.zip'
    secrets: inherit
